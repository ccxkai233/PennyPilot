[alembic]
# This file is intentionally kept in backend/ so the documented
# ``cd backend && alembic upgrade head`` command works from a checkout.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os
# The URL is replaced by alembic/env.py from the application settings.  It is
# kept here as a harmless fallback for tools that inspect alembic.ini only.
sqlalchemy.url = postgresql+psycopg://pennypilot:pennypilot_dev_password@localhost:5432/pennypilot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
