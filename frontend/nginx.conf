server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Vue router uses history mode.  Return the application shell for
    # client-side routes while still serving static assets directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Used by Docker Compose and kept separate from the application's /health
    # endpoint, which Caddy proxies to FastAPI for a database-aware check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Immutable Vite assets can be cached safely by browsers and intermediate
    # proxies because their filenames contain content hashes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
